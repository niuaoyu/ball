<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>篮球案例库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f59e0b'/%3E%3Cpath d='M2 16h28M16 2c4 4 4 24 0 28M16 2c-4 4-4 24 0 28M4 7c8 5 16 5 24 0M4 25c8-5 16-5 24 0' stroke='%231a1206' stroke-width='1.4' fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#22201c; --sub:#7a766d;
    --line:#e6e2d8; --brand:#0f766e; --brand-soft:#e3f1ef;
    --amber:#f59e0b; --amber-soft:#fdf2dd; --danger:#b3261e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.5;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:18px 18px 48px;}

  header.top{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  header.top h1{font-size:20px; margin:0; letter-spacing:.5px;}
  header.top .meta{color:var(--sub); font-size:13px;}

  .err{background:#fdecec; border:1px solid #f3c2c2; color:#9b2c2c;
    border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:14px; display:none;}
  .err.show{display:block;}

  /* 工具栏：搜索 + 编辑开关 */
  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .toolbar input[type=search]{
    flex:1; min-width:180px; font:inherit; padding:9px 12px; border:1px solid var(--line);
    border-radius:10px; background:#faf9f5; outline:none;
  }
  .toolbar input[type=search]:focus{border-color:var(--brand); background:#fff;}
  .toolbar .toggle{
    display:flex; align-items:center; gap:6px; font-size:13px; color:var(--sub);
    padding:8px 12px; border:1px solid var(--line); border-radius:10px; cursor:pointer;
    background:#fff; user-select:none;
  }
  .toolbar .toggle.on{color:var(--brand); border-color:var(--brand); background:var(--brand-soft);}
  .toolbar .auth-btn{
    font-size:13px; color:var(--sub); padding:8px 14px; border:1px solid var(--line);
    border-radius:10px; cursor:pointer; background:#fff; user-select:none; white-space:nowrap;
  }
  .toolbar .auth-btn:hover{border-color:var(--brand); color:var(--brand);}
  .toolbar .auth-btn.logged{color:var(--brand); border-color:var(--brand); background:var(--brand-soft);}
  .editor .field input[type=password],.editor .field input[type=email]{
    padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:#faf9f5; font:inherit; outline:none;
  }
  .editor .field input:focus{border-color:var(--brand); background:#fff;}
  .editor .hint.err{color:var(--danger);}

  /* 标签筛选胶囊 */
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  .filters .label{font-size:12.5px; color:var(--sub);}
  .pill{
    font-size:13px; padding:4px 12px; border-radius:20px; cursor:pointer;
    background:#fff; border:1px solid var(--line); color:var(--ink);
    white-space:nowrap; user-select:none;
  }
  .pill:hover{border-color:var(--brand);}
  .pill.on{background:var(--brand); border-color:var(--brand); color:#fff;}
  .pill .dim{opacity:.55; font-size:11px;}

  /* 卡片墙 */
  .wall{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
    cursor:pointer; transition:border-color .12s, transform .12s; display:flex; flex-direction:column;
  }
  .card:hover{border-color:var(--brand);}
  .card:active{transform:scale(.99);}
  .thumb{position:relative; aspect-ratio:16/9; background:#111; overflow:hidden;}
  .thumb video{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .ph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#cfcabf; font-size:12px;}
  .thumb .dur{
    position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.65); color:#fff;
    font-size:11.5px; padding:1px 7px; border-radius:6px; font-variant-numeric:tabular-nums;
  }
  .card .body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card .name{font-weight:600; font-size:14.5px; line-height:1.3;}
  .card .chips{display:flex; gap:5px; flex-wrap:wrap;}
  .chip{
    font-size:11.5px; padding:1px 7px; border-radius:20px;
    background:var(--amber-soft); color:#92600a; border:1px solid #f0dfbd; white-space:nowrap;
  }
  .chip.dim{background:var(--brand-soft); color:var(--brand); border-color:#c5e0dc;}
  .card .note{font-size:12.5px; color:var(--sub); line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card .foot{margin-top:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub);}
  .card .edit{
    margin-left:auto; border:none; background:none; color:var(--brand); cursor:pointer;
    font-size:12.5px; padding:2px 6px; border-radius:6px;
  }
  .card .edit:hover{background:var(--brand-soft);}
  .empty{padding:48px 16px; text-align:center; color:var(--sub); font-size:14px; grid-column:1/-1;}

  /* 播放弹层 */
  .overlay{
    position:fixed; inset:0; background:rgba(20,18,14,.6); display:none;
    align-items:center; justify-content:center; z-index:50; padding:18px;
  }
  .overlay.show{display:flex;}
  /* 叠加在正文页之上的编辑页/引用选择器，层级更高 */
  #noteEditOverlay{z-index:52;}
  #refPickerOverlay{z-index:53;}
  /* 播放器最上层：从笔记引用点开视频时盖住笔记页，关闭后回到笔记 */
  #overlay{z-index:55;}
  .modal{
    background:var(--card); border-radius:16px; width:min(900px,100%); max-height:92vh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .modal .mhead{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line);}
  .modal .mhead .t{font-weight:600; font-size:15px;}
  .modal .mhead .close{margin-left:auto; border:none; background:none; font-size:20px; cursor:pointer; color:var(--sub); padding:0 4px; line-height:1;}
  .modal .mbody{overflow-y:auto;}
  .modal .player{background:#111; aspect-ratio:16/9; position:relative;}
  .modal .player video{width:100%; height:100%; display:block;}
  .modal .player .loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#cfcabf; font-size:14px;}
  .modal .player .playstate{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:52px; color:rgba(255,255,255,.55); pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.4); transition:opacity .15s; opacity:0;
  }
  .modal .player .playstate.show{opacity:1;}
  .modal .info{padding:12px 16px;}
  .modal .info .chips{display:flex; gap:5px; flex-wrap:wrap; margin:6px 0;}
  .modal .info .note{color:var(--sub); font-size:13.5px; margin:4px 0 0; white-space:pre-wrap;}
  .modal .info .src{color:var(--sub); font-size:12.5px; margin-top:6px;}
  .modal .pbar{display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .modal .pbar button{font:inherit; font-size:13px; color:var(--ink); background:#f3f1ea;
    border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer;}
  .modal .pbar button:hover{background:#ebe8df;}
  .modal .pbar button.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .modal .pbar button.on{background:var(--brand-soft); border-color:var(--brand); color:var(--brand);}
  .modal .pbar button kbd{background:rgba(255,255,255,.25); border-radius:4px; padding:0 4px; font-size:11px; margin-left:3px;}
  .modal .pbar .speed-group{display:inline-flex; gap:0;}
  .modal .pbar .speed-group .speed{border-radius:0; border-right-width:0;}
  .modal .pbar .speed-group .speed:first-child{border-radius:8px 0 0 8px;}
  .modal .pbar .speed-group .speed:last-child{border-radius:0 8px 8px 0; border-right-width:1px;}
  .modal .pbar .speed-group .speed.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .modal .pbar .spacer{flex:1;}
  .modal .pbar .time{margin-left:8px; color:var(--sub); font-size:12.5px; font-variant-numeric:tabular-nums;}

  /* 编辑弹层 */
  .editor{width:min(560px,100%);}
  .editor .ebody{padding:16px; display:flex; flex-direction:column; gap:12px; overflow-y:auto;}
  .editor .field{display:flex; flex-direction:column; gap:5px;}
  .editor .field label{font-size:12.5px; color:var(--sub);}
  .editor .field input,.editor .field textarea{
    font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:10px;
    background:#faf9f5; outline:none; resize:vertical;
  }
  .editor .field input:focus,.editor .field textarea:focus{border-color:var(--brand); background:#fff;}
  .editor .field textarea{min-height:70px;}
  .editor .tagrow{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .editor .tagrow input{flex:1; min-width:120px;}
  .editor .tagrow button{font:inherit; font-size:13px; padding:7px 12px; border:1px solid var(--line);
    border-radius:8px; background:#f3f1ea; cursor:pointer;}
  .editor .tagrow button:hover{background:#ebe8df;}
  .editor .hint{font-size:12px; color:var(--sub);}
  .editor .efoot{display:flex; gap:10px; justify-content:flex-end; padding:12px 16px; border-top:1px solid var(--line);}
  .editor .efoot button{font:inherit; font-size:13px; padding:8px 16px; border-radius:9px; cursor:pointer;}
  .editor .efoot .cancel{background:#fff; border:1px solid var(--line); color:var(--ink);}
  .editor .efoot .save{background:var(--brand); border:1px solid var(--brand); color:#fff;}
  .editor .efoot .danger{background:#fff; border:1px solid #f0c5c0; color:var(--danger);}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:#22201c; color:#fff; padding:9px 18px; border-radius:10px; font-size:13.5px;
    opacity:0; pointer-events:none; transition:all .2s; z-index:60;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ===== 顶栏导航 ===== */
  .top-left{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .main-nav{display:flex; gap:6px; align-items:center;}
  .nav-btn{
    font:inherit; font-size:13.5px; padding:6px 14px; border:1px solid var(--line);
    border-radius:20px; background:#fff; color:var(--sub); cursor:pointer; white-space:nowrap;
  }
  .nav-btn:hover{border-color:var(--brand); color:var(--brand);}
  .nav-btn.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .view.hidden{display:none;}
  .hidden{display:none;}
  .notes-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .notes-title{font-weight:600; font-size:16px;}
  .spacer{flex:1;}

  /* ===== 播放浮层底部笔记行 ===== */
  .note-row{
    display:flex; align-items:center; gap:8px; padding:9px 16px;
    border-top:1px solid var(--line); font-size:13px; color:var(--sub); min-height:20px;
  }
  .note-row .note-label{flex-shrink:0; font-size:12.5px; color:var(--sub); opacity:.7;}
  .note-row .note-text{
    flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink);
  }
  .note-row .note-text.empty{color:var(--sub); opacity:.7;}
  .mini-btn{
    flex-shrink:0; font:inherit; font-size:12.5px; padding:3px 10px; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--sub); cursor:pointer;
  }
  .mini-btn:hover{border-color:var(--brand); color:var(--brand);}
  .mini-btn.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .note-edit{padding:0 16px 12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px;}
  .note-edit.hidden{display:none;}
  .note-edit textarea{
    font:inherit; font-size:13.5px; padding:9px 12px; border:1px solid var(--line);
    border-radius:10px; background:#faf9f5; outline:none; resize:vertical; min-height:60px; width:100%;
  }
  .note-edit textarea:focus{border-color:var(--brand); background:#fff;}
  .note-edit-actions{display:flex; gap:8px; justify-content:flex-end;}

  /* ===== 主题笔记弹窗（复用 editor 的 field 结构，宽度更宽） ===== */
  .note-modal{width:min(760px,100%);}
  /* 正文阅读页 */
  .note-read{display:flex; flex-direction:column; gap:12px; padding:20px 22px; max-height:62vh; overflow-y:auto;}
  .note-head-title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .note-read-tags{display:flex; gap:6px; flex-wrap:wrap;}
  .note-read-body{
    font-size:14px; line-height:1.8; color:var(--ink); white-space:pre-wrap; word-break:break-word;
  }
  .note-read-body .ref-inline{margin:2px 4px;}
  .note-read-body .ref-inline .ref-del{display:none;}
  .mhead-right{display:flex; align-items:center; gap:8px; margin-left:auto;}
  .edit-entry{
    font:inherit; font-size:12.5px; padding:3px 10px; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--sub); cursor:pointer; white-space:nowrap;
  }
  .edit-entry:hover{border-color:var(--brand); color:var(--brand);}
  #noteModal .mhead .close{margin-left:0;}
  .note-body{
    min-height:180px; max-height:46vh; overflow-y:auto; padding:12px 14px;
    border:1px solid var(--line); border-radius:10px; background:#faf9f5; font-size:14.5px; line-height:1.7;
    outline:none; white-space:pre-wrap;
  }
  .note-body:focus{border-color:var(--brand); background:#fff;}
  .note-body:empty::before{content:attr(data-placeholder); color:#b6b1a6; pointer-events:none;}
  .note-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .insert-ref-btn{
    font:inherit; font-size:13px; padding:7px 14px; border:1px solid var(--line);
    border-radius:8px; background:#f3f1ea; color:var(--ink); cursor:pointer; white-space:nowrap;
  }
  .insert-ref-btn:hover{border-color:var(--brand); color:var(--brand); background:#fff;}

  /* 内联引用块 */
  .ref-inline{
    display:inline-flex; align-items:center; gap:8px; padding:4px 10px 4px 6px; margin:2px 4px;
    border:1px solid #f0dfbd; border-radius:10px; background:var(--amber-soft); cursor:pointer;
    vertical-align:middle; user-select:none;
  }
  .ref-inline:hover{border-color:var(--amber);}
  .ref-inline .ref-thumb{
    width:44px; height:25px; border-radius:6px; background:#111; overflow:hidden; flex-shrink:0;
  }
  .ref-inline .ref-thumb video{width:100%; height:100%; object-fit:cover; display:block;}
  .ref-inline .ref-thumb .ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#cfcabf; font-size:10px;}
  .ref-inline .ref-meta{display:flex; flex-direction:column; line-height:1.3;}
  .ref-inline .ref-meta .ref-title{font-size:12.5px; color:var(--ink); font-weight:600; max-width:160px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ref-inline .ref-meta .ref-dur{font-size:11px; color:#92600a;}
  .ref-inline .ref-del{
    flex-shrink:0; border:none; background:none; color:#b48a3a; cursor:pointer; font-size:14px;
    padding:0 2px; line-height:1;
  }
  .ref-inline .ref-del:hover{color:var(--danger);}

  /* 引用选择器 */
  .ref-picker{width:min(640px,100%);}
  .ref-picker-body{display:flex; flex-direction:column; gap:12px; padding:16px;}
  .ref-picker-body input[type=search]{
    font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:10px;
    background:#faf9f5; outline:none;
  }
  .ref-picker-body input[type=search]:focus{border-color:var(--brand); background:#fff;}
  .ref-tag-label{font-size:12.5px; color:var(--sub);}
  .ref-clip-list{display:flex; flex-direction:column; gap:8px; max-height:44vh; overflow-y:auto;}
  .ref-clip-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line);
    border-radius:10px; cursor:pointer; background:#fff; transition:border-color .1s, background .1s;
  }
  .ref-clip-item:hover{border-color:var(--brand);}
  .ref-clip-item.sel{border-color:var(--brand); background:var(--brand-soft);}
  .ref-clip-item .ref-thumb{width:56px; height:32px; border-radius:6px; background:#111; overflow:hidden; flex-shrink:0;}
  .ref-clip-item .ref-thumb video{width:100%; height:100%; object-fit:cover; display:block;}
  .ref-clip-item .ref-thumb .ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#cfcabf; font-size:10px;}
  .ref-clip-item .ref-info{flex:1; min-width:0;}
  .ref-clip-item .ref-info .ref-title{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ref-clip-item .ref-info .ref-tags{font-size:11.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ref-clip-item .ref-check{flex-shrink:0; width:20px; height:20px; border:1px solid var(--line); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;}
  .ref-clip-item.sel .ref-check{background:var(--brand); border-color:var(--brand);}
  .ref-clip-empty{padding:30px 10px; text-align:center; color:var(--sub); font-size:13px;}

  /* ===== 笔记卡片（复用 wall 但展示不同） ===== */
  .note-card .body .note-summary{
    font-size:12.5px; color:var(--sub); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .note-card .body .note-foot{margin-top:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub);}

  @media (max-width:600px){
    .wall{grid-template-columns:1fr 1fr; gap:10px;}
    .wrap{padding:12px 12px 40px;}
  }
  @media (max-width:420px){
    .wall{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-left">
      <h1>篮球案例库</h1>
      <nav class="main-nav" id="mainNav">
        <button class="nav-btn active" id="navClips">案例库</button>
        <button class="nav-btn" id="navNotes">笔记</button>
      </nav>
    </div>
    <span class="meta" id="metaText">正在加载…</span>
  </header>

  <div class="err" id="errBox"></div>

  <!-- ===== 案例库视图 ===== -->
  <div id="clipsView" class="view">
    <div class="toolbar">
      <input type="search" id="search" placeholder="搜索标签、备注、来源（空格分隔 = 同时命中）" autocomplete="off">
      <div class="toggle" id="editToggle" title="开启后可点卡片右上角编辑">编辑模式</div>
      <div class="auth-btn" id="authBtn" title="登录后才能编辑或删除案例">登录</div>
    </div>

    <div class="filters" id="filters"></div>

    <div class="wall" id="wall"></div>
  </div>

  <!-- ===== 笔记视图 ===== -->
  <div id="notesView" class="view hidden">
    <div class="notes-head">
      <span class="notes-title">我的笔记</span>
      <span class="spacer"></span>
      <button class="auth-btn" id="btnNewNote" title="新建一篇主题笔记">＋ 新建笔记</button>
    </div>
    <div class="wall note-wall" id="noteWall"></div>
  </div>
</div>

<!-- 播放弹层 -->
<div class="overlay" id="overlay">
  <div class="modal" id="playerModal">
    <div class="mhead">
      <span class="t" id="pTitle"></span>
      <button class="close" id="btnClose" title="关闭 (Esc)">&times;</button>
    </div>
    <div class="mbody">
      <div class="player" id="playerBox">
        <video id="pVideo" playsinline controls preload="auto"></video>
        <div class="loading" id="pLoading">加载中…</div>
        <div class="playstate" id="playState">▶</div>
      </div>
      <div class="info">
        <div class="chips" id="pTags"></div>
        <div class="src" id="pSrc"></div>
      </div>
      <div class="note-row" id="noteRow">
        <span class="note-label">笔记</span>
        <span class="note-text" id="pNote">（无）</span>
        <button class="mini-btn" id="btnEditNote">编辑</button>
      </div>
      <div class="note-edit hidden" id="noteEdit">
        <textarea id="pNoteInput" rows="3" placeholder="写点思考…"></textarea>
        <div class="note-edit-actions">
          <button class="mini-btn" id="btnCancelNote">取消</button>
          <button class="mini-btn primary" id="btnSaveNote">保存</button>
        </div>
      </div>
    </div>
    <div class="pbar">

/* ---------- 工具 ---------- */
function fmtTime(t) {
  if (!isFinite(t)) return '00:00';
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
let toastTimer;
function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2000);
}
function showError(msg) {
  el.err.textContent = msg;
  el.err.classList.add('show');
}
function clearError() { el.err.classList.remove('show'); }

function clipText(c) {
  const parts = [c.title, c.note, c.memo];
  (c.tags || []).forEach(t => parts.push(t.dimension, t.value));
  const s = c.source || {};
  parts.push(s.matchTitle, s.fileName);
  return parts.filter(Boolean).join(' ');
}

/* ---------- 认证 ---------- */
const AUTH_KEY = 'tl_auth_session';

/* 判断是否已登录（有有效 token） */
function isLoggedIn() {
  return !!(state.session && state.session.access_token);
}
/* 带认证的请求头（登录后写/删需要） */
function authHeaders() {
  const h = { apikey: SUPA_KEY, 'Content-Type': 'application/json' };
  if (state.session && state.session.access_token) {
    h.Authorization = 'Bearer ' + state.session.access_token;
  }
  return h;
}

/* 用 refresh_token 换新 access_token（Supabase access_token 默认 1h 过期） */
async function refreshToken() {
  const s = state.session;
  if (!s || !s.refresh_token) return false;
  try {
    const res = await fetch(SUPA_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return false;
    s.access_token = data.access_token;
    if (data.refresh_token) s.refresh_token = data.refresh_token;
    if (data.user) s.user = data.user;
    localStorage.setItem(AUTH_KEY, JSON.stringify(s));
    refreshAuthUI();
    return true;
  } catch (_) {
    return false;
  }
}

/* 带认证的请求：遇 401 自动刷新 token 重试一次，再失败则清除登录态并返回 */
async function authFetch(url, options) {
  let res = await fetch(url, options);
  if (res.status === 401 && await refreshToken()) {
    // 用新 token 重建请求头重试
    const opts = { ...options };
    opts.headers = { ...(options.headers || {}), Authorization: 'Bearer ' + state.session.access_token };
    res = await fetch(url, opts);
  }
  if (res.status === 401) {
    // 刷新也失败，清除过期登录态
    state.session = null;
    localStorage.removeItem(AUTH_KEY);
    refreshAuthUI();
  }
  return res;
}
/* 更新登录态 UI */
function refreshAuthUI() {
  const logged = isLoggedIn();
  el.authBtn.textContent = logged ? (getEmail() + ' · 退出') : '登录';
  el.authBtn.classList.toggle('logged', logged);
  el.authBtn.title = logged ? '点击退出登录' : '登录后才能编辑或删除案例';
  el.editToggle.style.display = logged ? '' : 'none';
  if (!logged) { state.editing = false; el.editToggle.classList.remove('on'); }
}
function getEmail() {
  return (state.session && state.session.user && state.session.user.email) || '';
}
/* 登录 */
async function doLogin() {
  const email = el.loginEmail.value.trim();
  const pass = el.loginPass.value;
  if (!email || !pass) { el.loginHint.textContent = '请输入邮箱和密码'; el.loginHint.classList.add('err'); return; }
  el.loginHint.textContent = '登录中…';
  el.loginHint.classList.remove('err');
  try {
    const res = await fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const msg = (data && (data.error_description || data.msg)) || ('登录失败 HTTP ' + res.status);
      el.loginHint.textContent = '登录失败：' + msg;
      el.loginHint.classList.add('err');
      return;
    }
    state.session = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user };
    localStorage.setItem(AUTH_KEY, JSON.stringify(state.session));
    closeLogin();
    refreshAuthUI();
    toast('已登录：' + getEmail());
  } catch (e) {
    el.loginHint.textContent = '网络错误：' + e.message;
    el.loginHint.classList.add('err');
  }
}
function logout() {
  state.session = null;
  localStorage.removeItem(AUTH_KEY);

function restoreSession() {
  try {
    const raw = localStorage.getItem(AUTH_KEY);

  if (state.session && !state.session.access_token) state.session = null;

}

/* 从正文 HTML 提取纯文本摘要 */
function noteSummary(n) {

/* ---------- 标签统计（生成筛选胶囊） ---------- */
function buildFilters() {
  const count = {};
  state.clips.forEach(c => (c.tags || []).forEach(t => {
    if (t && t.value) count[t.value] = (count[t.value] || 0) + 1;
  }));
  el.filters.innerHTML = '';
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = '按标签筛选：';
  el.filters.appendChild(label);
  const all = document.createElement('span');
  all.className = 'pill' + (state.activeTags.size === 0 ? ' on' : '');
  all.textContent = '全部';
  all.addEventListener('click', () => { state.activeTags.clear(); applyFilters(); });
  el.filters.appendChild(all);
  Object.keys(count).sort((a,b) => count[b]-count[a]).forEach(v => {
    const p = document.createElement('span');
    p.className = 'pill' + (state.activeTags.has(v) ? ' on' : '');
    p.textContent = v;
    p.appendChild(document.createElement('span')).className = 'dim';
    p.lastChild.textContent = ' ' + count[v];
    p.addEventListener('click', () => {
      if (state.activeTags.has(v)) state.activeTags.delete(v); else state.activeTags.add(v);
      applyFilters();
    });
    el.filters.appendChild(p);
  });
}

function applyFilters() {
  const terms = el.search.value.trim().split(/\s+/).filter(Boolean);
  state.results = state.clips.filter(c => {
    if (state.activeTags.size) {
      const vals = new Set((c.tags || []).map(t => t.value));
      for (const v of state.activeTags) if (!vals.has(v)) return false;
    }
    if (terms.length) {
      const text = clipText(c).toLowerCase();
      if (!terms.every(t => text.includes(t.toLowerCase()))) return false;
    }
    return true;
  });
  buildFilters();
  renderWall();
}

/* ---------- 渲染卡片墙 ---------- */
function renderWall() {
  el.meta.textContent = '共 ' + state.clips.length + ' 个片段 · 显示 ' + state.results.length + ' 个';
  el.wall.innerHTML = '';
  if (!state.results.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = state.clips.length ? '没有匹配的片段' : '案例库为空';
    el.wall.appendChild(d);
    return;
  }
  state.results.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const ph = document.createElement('div');
    ph.className = 'ph'; ph.textContent = '加载缩略图…';
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'metadata';
    v.src = c.video_url;
    /* 不用 canvas 导出图片：R2 未开跨域时 canvas 会被污染、toDataURL 直接抛异常。
       直接让 video 元素渲染第一帧当封面（需要真实触发一次 seek 才会解码出画面） */
    v.addEventListener('loadedmetadata', () => { try { v.currentTime = 0.001; } catch (_) {} });
    v.addEventListener('seeked', () => { if (ph.parentNode) ph.remove(); });
    v.addEventListener('loadeddata', () => { if (ph.parentNode) ph.remove(); });
    v.addEventListener('error', () => {
      v.remove();
      ph.textContent = '缩略图加载失败';
    });
    thumb.appendChild(v);
    thumb.appendChild(ph);
    const dur = document.createElement('span');
    dur.className = 'dur';
    dur.textContent = (c.duration ? c.duration.toFixed(1) : '?') + 's';
    thumb.appendChild(dur);
    card.appendChild(thumb);

    const body = document.createElement('div');
    body.className = 'body';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = c.title || c.folder || '未命名';
    body.appendChild(name);

    const chips = document.createElement('div');
    chips.className = 'chips';
    (c.tags || []).forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'chip dim';
      chip.textContent = (t.dimension ? t.dimension + ':' : '') + t.value;
      chips.appendChild(chip);
    });
    body.appendChild(chips);

    if (c.memo) {
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = c.memo;
      body.appendChild(note);
    }

    const foot = document.createElement('div');
    foot.className = 'foot';
    const s = c.source || {};
    foot.textContent = s.matchTitle ? s.matchTitle.slice(0, 20) : '';
    const editBtn = document.createElement('button');
    editBtn.className = 'edit';
    editBtn.textContent = '编辑';
    editBtn.style.display = (state.editing && isLoggedIn()) ? '' : 'none';
    editBtn.addEventListener('click', e => { e.stopPropagation(); openEditor(c); });
    foot.appendChild(editBtn);
    body.appendChild(foot);

    card.appendChild(body);
    card.addEventListener('click', () => openPlayer(c));
    el.wall.appendChild(card);
  });
}

/* ---------- 播放弹层 ---------- */

function loadVideo() {

/* 播放/暂停状态图标：暂停时显示一个不显眼的播放三角形，播放时隐藏 */

function step(delta) {

async function deleteClip() {

/* 保存笔记 */
async function saveNote() {
  if (!isLoggedIn()) { toast('请先登录'); openLogin(); return; }
  const title = el.noteTitleInput.value.trim();
  const body = el.noteBody.innerHTML;
  if (!title && !body.replace(/<[^>]*>/g, '').trim()) { toast('标题和正文不能都为空'); return; }
  const payload = { title, body, tags: state.noteTags };
  let res;
  if (state.noteTarget && state.noteTarget.id) {
    res = await authFetch(SUPA_URL + '/rest/v1/notes?id=eq.' + encodeURIComponent(state.noteTarget.id), {
      method: 'PATCH',
      headers: { ...authHeaders(), Prefer: 'return=representation' },
      body: JSON.stringify(payload)
    });
  } else {
    res = await authFetch(SUPA_URL + '/rest/v1/notes', {
      method: 'POST',
      headers: { ...authHeaders(), Prefer: 'return=representation' },
      body: JSON.stringify(payload)
    });
  }
  if (!res.ok) {
    const msg = res.status === 404 ? 'notes 表不存在，请先在 Supabase 执行建表 SQL'
      : res.status === 401 ? '登录已过期，请重新登录'
      : '保存失败：HTTP ' + res.status;
    toast(msg);
    if (res.status === 401) openLogin();
    return;
  }
  const saved = await res.json();
  const obj = Array.isArray(saved) ? saved[0] : saved;
  if (state.noteTarget && state.noteTarget.id) {
    Object.assign(state.noteTarget, obj);
  } else {
    state.notes.unshift(obj);
    state.noteTarget = obj; // 新建后记住
  }
  state.noteDirty = false;
  state.noteTags = (obj.tags || []).slice();
  // 关闭编辑页，回到正文阅读页（如果正文页还开着则刷新它）
  closeNoteEdit();
  if (el.noteOverlay.classList.contains('show')) {
    renderNoteRead();
  }
  renderNoteWall();
  toast('笔记已保存');
}

async function deleteNote() {

  state.notes = state.notes.filter(x => x.id !== n.id);

/* ---------- 内联引用 ---------- */

/* 生成一个内联引用块（可点击播放） */
function buildRefInline(clipId) {
  const c = state.clips.find(x => x.id === clipId);
  if (!c) return null;
  const span = document.createElement('span');
  span.className = 'ref-inline';
  span.setAttribute('contenteditable', 'false');
  span.dataset.clipId = clipId;

  const thumb = document.createElement('span');
  thumb.className = 'ref-thumb';
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'metadata';
  v.src = c.video_url;
  v.addEventListener('loadeddata', () => { /* 首帧 */ });
  v.addEventListener('error', () => { v.remove(); const ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = '▶'; thumb.appendChild(ph); });
  thumb.appendChild(v);
  span.appendChild(thumb);

  const meta = document.createElement('span');
  meta.className = 'ref-meta';
  const title = document.createElement('span');
  title.className = 'ref-title';
  title.textContent = c.title || '未命名';
  meta.appendChild(title);
  const dur = document.createElement('span');
  dur.className = 'ref-dur';
  dur.textContent = (c.duration ? c.duration.toFixed(1) : '?') + 's';
  meta.appendChild(dur);
  span.appendChild(meta);

  const del = document.createElement('button');
  del.className = 'ref-del';
  del.textContent = '×';
  del.title = '移除引用';
  del.addEventListener('click', e => { e.stopPropagation(); span.remove(); state.noteDirty = true; });
  span.appendChild(del);

  span.addEventListener('click', () => openPlayer(c));
  return span;
}

/* 引用选择器 */
function openRefPicker() {
  // 记录当前光标位置（Range）
  const sel = window.getSelection();
  state.refCursor = null;
  if (sel.rangeCount && el.noteBody.contains(sel.anchorNode)) {
    state.refCursor = sel.getRangeAt(0).cloneRange();
  }
  state.refSelected.clear();
  state.refActiveTags.clear();
  el.refSearch.value = '';
  renderRefTagFilter();
  renderRefList();
  el.refPickerOverlay.classList.add('show');
  el.refSearch.focus();
}

function closeRefPicker() {
  el.refPickerOverlay.classList.remove('show');
  state.refCursor = null;
  state.refSelected.clear();
}

/* 引用选择器里的标签筛选胶囊 */
function renderRefTagFilter() {
  const count = {};
  state.clips.forEach(c => (c.tags || []).forEach(t => { if (t && t.value) count[t.value] = (count[t.value] || 0) + 1; }));
  el.refTagFilter.innerHTML = '';
  const all = document.createElement('span');
  all.className = 'pill' + (state.refActiveTags.size === 0 ? ' on' : '');
  all.textContent = '全部';
  all.addEventListener('click', () => { state.refActiveTags.clear(); renderRefTagFilter(); renderRefList(); });
  el.refTagFilter.appendChild(all);
  Object.keys(count).sort((a, b) => count[b] - count[a]).forEach(v => {
    const p = document.createElement('span');
    p.className = 'pill' + (state.refActiveTags.has(v) ? ' on' : '');
    p.textContent = v + ' ' + count[v];
    p.addEventListener('click', () => {
      if (state.refActiveTags.has(v)) state.refActiveTags.delete(v); else state.refActiveTags.add(v);
      renderRefTagFilter(); renderRefList();
    });
    el.refTagFilter.appendChild(p);
  });
}

function refPickerMatches(c) {
  if (state.refActiveTags.size) {
    const vals = new Set((c.tags || []).map(t => t.value));
    for (const v of state.refActiveTags) if (!vals.has(v)) return false;
  }
  const q = el.refSearch.value.trim().toLowerCase();
  if (q) {
    const text = clipText(c).toLowerCase();
    if (!text.includes(q)) return false;
  }
  return true;
}

function renderRefList() {
  el.refClipList.innerHTML = '';
  const list = state.clips.filter(refPickerMatches);
  if (!list.length) {
    const d = document.createElement('div');
    d.className = 'ref-clip-empty';
    d.textContent = '没有匹配的片段';
    el.refClipList.appendChild(d);
  } else {
    list.forEach(c => {
      const item = document.createElement('div');
      item.className = 'ref-clip-item' + (state.refSelected.has(c.id) ? ' sel' : '');

      const thumb = document.createElement('span');
      thumb.className = 'ref-thumb';
      const v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.preload = 'metadata';
      v.src = c.video_url;
      v.addEventListener('error', () => { v.remove(); const ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = '▶'; thumb.appendChild(ph); });
      thumb.appendChild(v);
      item.appendChild(thumb);

      const info = document.createElement('span');
      info.className = 'ref-info';
      const t = document.createElement('div');
      t.className = 'ref-title';
      t.textContent = c.title || '未命名';
      info.appendChild(t);
      const tags = document.createElement('div');
      tags.className = 'ref-tags';
      tags.textContent = (c.tags || []).map(x => x.value).join(' · ');
      info.appendChild(tags);
      item.appendChild(info);

      const check = document.createElement('span');
      check.className = 'ref-check';
      check.textContent = '✓';
      item.appendChild(check);

      item.addEventListener('click', () => {
        if (state.refSelected.has(c.id)) state.refSelected.delete(c.id); else state.refSelected.add(c.id);
        item.classList.toggle('sel', state.refSelected.has(c.id));
        el.refCount.textContent = '已选 ' + state.refSelected.size + ' 条';
      });
      el.refClipList.appendChild(item);
    });
  }
  el.refCount.textContent = '已选 ' + state.refSelected.size + ' 条';
}

/* 确认插入引用到正文光标处 */
function confirmInsertRef() {
  if (!state.refSelected.size) { toast('请先勾选要引用的片段'); return; }
  const ids = Array.from(state.refSelected);
  // 插入前先记住最后一个节点（insertNode 后 fragment 会被清空，不能再用 frag.lastChild）
  const frag = document.createDocumentFragment();
  ids.forEach(id => {
    const node = buildRefInline(id);
    if (node) {
      frag.appendChild(node);
      frag.appendChild(document.createTextNode(' '));
    }
  });
  if (!frag.childNodes.length) { closeRefPicker(); return; }
  const last = frag.lastChild;
  let inserted = 0;
  try {
    el.noteBody.focus();
    const sel = window.getSelection();
    let range;
    if (state.refCursor && el.noteBody.contains(state.refCursor.startContainer)) {
      range = state.refCursor.cloneRange();
    } else {
      range = document.createRange();
      range.selectNodeContents(el.noteBody);
      range.collapse(false); // 光标放到正文末尾
    }
    range.deleteContents();
    range.insertNode(frag);
    inserted = ids.length;
    // 把光标移到插入内容之后（用插入前记住的最后一个节点定位）
    if (last) {
      range.setStartAfter(last);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }
    state.noteDirty = true;
  } finally {
    // 无论插入过程是否出错，都关闭弹窗，避免「没关 + 重复点击重复插入」
    closeRefPicker();
  }
  if (inserted) toast('已插入 ' + inserted + ' 个引用');
}

/* ---------- 事件绑定 ---------- */
el.search.addEventListener('input', applyFilters);
el.editToggle.addEventListener('click', () => {
  if (!isLoggedIn()) { toast('请先登录'); openLogin(); return; }
  state.editing = !state.editing;
  el.editToggle.classList.toggle('on', state.editing);
  renderWall();
});
el.authBtn.addEventListener('click', () => { isLoggedIn() ? logout() : openLogin(); });
el.btnLoginSubmit.addEventListener('click', doLogin);
el.btnLoginClose.addEventListener('click', closeLogin);
el.btnLoginCancel.addEventListener('click', closeLogin);
el.loginOverlay.addEventListener('click', e => { if (e.target === el.loginOverlay) closeLogin(); });
el.loginPass.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
el.loginEmail.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
el.pPrev.addEventListener('click', () => navPlayer(-1));
el.pNext.addEventListener('click', () => navPlayer(1));
el.pPlay.addEventListener('click', togglePlay);
el.pLoop.addEventListener('click', toggleLoop);
el.pEdit.addEventListener('click', () => openEditor(state.current));
el.pPrevFrame.addEventListener('click', () => step(-STEP));
el.pBack1s.addEventListener('click', () => step(-1));
el.pFwd1s.addEventListener('click', () => step(1));
el.pNextFrame.addEventListener('click', () => step(STEP));
el.speedGroup.querySelectorAll('.speed').forEach(b => {
  b.addEventListener('click', () => setRate(parseFloat(b.dataset.rate)));
});
// 使用 video 原生 controls 处理播放/暂停和进度拖动，避免自定义点击逻辑干扰进度条。
el.btnClose.addEventListener('click', closePlayer);
el.overlay.addEventListener('click', e => { if (e.target === el.overlay) closePlayer(); });
el.btnEditClose.addEventListener('click', closeEditor);
el.btnEditCancel.addEventListener('click', closeEditor);
el.editOverlay.addEventListener('click', e => { if (e.target === el.editOverlay) closeEditor(); });
el.btnAddTag.addEventListener('click', addTagFromInput);
el.eTagInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addTagFromInput(); }
});
el.btnEditSave.addEventListener('click', saveEdit);
el.btnEditDelete.addEventListener('click', deleteClip);

/* 播放浮层底部笔记 */
el.btnEditNote.addEventListener('click', () => toggleNoteEdit(true));
el.btnCancelNote.addEventListener('click', () => toggleNoteEdit(false));
el.btnSaveNote.addEventListener('click', savePlayerNote);

/* 视图切换 */
el.navClips.addEventListener('click', () => setView('clips'));
el.navNotes.addEventListener('click', () => setView('notes'));

/* 主题笔记 */
el.btnNewNote.addEventListener('click', newNote);
el.btnNoteClose.addEventListener('click', closeNote);
el.btnNoteEdit.addEventListener('click', enterEditMode);
el.btnNoteEditClose.addEventListener('click', closeNoteEdit);
el.btnNoteEditCancel.addEventListener('click', cancelNoteEdit);
el.btnNoteSave.addEventListener('click', saveNote);
el.btnNoteDelete.addEventListener('click', deleteNote);
el.noteOverlay.addEventListener('click', e => { if (e.target === el.noteOverlay) closeNote(); });
el.noteEditOverlay.addEventListener('click', e => { if (e.target === el.noteEditOverlay) cancelNoteEdit(); });
el.btnNoteAddTag.addEventListener('click', addNoteTag);
el.noteTagInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addNoteTag(); }
});
el.noteBody.addEventListener('input', () => { state.noteDirty = true; });

/* 引用 */
el.btnInsertRef.addEventListener('click', openRefPicker);
el.btnRefPickerClose.addEventListener('click', closeRefPicker);
el.btnRefPickerCancel.addEventListener('click', closeRefPicker);
el.btnConfirmRef.addEventListener('click', confirmInsertRef);
el.refPickerOverlay.addEventListener('click', e => { if (e.target === el.refPickerOverlay) closeRefPicker(); });
el.refSearch.addEventListener('input', renderRefList);

window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (el.overlay.classList.contains('show')) {
    switch (e.key) {
      case 'Escape': closePlayer(); break;
      case ' ': e.preventDefault(); togglePlay(); break;
      case ',': navPlayer(-1); break;
      case '.': navPlayer(1); break;
      case 'ArrowLeft':
        if (e.shiftKey) step(-1); else step(-STEP);
        break;
      case 'ArrowRight':
        if (e.shiftKey) step(1); else step(STEP);
        break;
      case 'j': case 'J':
        setRate(state.rate > 0.5 ? state.rate / 2 : 0.25);
        break;
      case 'l': case 'L':
        setRate(state.rate < 1 ? state.rate * 2 : 1);
        break;
    }
    return;
  }
  if (el.refPickerOverlay.classList.contains('show')) {
    if (e.key === 'Escape') closeRefPicker();
    return;
  }
  if (el.noteEditOverlay.classList.contains('show')) {
    if (e.key === 'Escape') cancelNoteEdit();
    return;
  }
  if (el.noteOverlay.classList.contains('show')) {
    if (e.key === 'Escape') closeNote();
    return;
  }
  if (el.editOverlay.classList.contains('show')) {
    if (e.key === 'Escape') closeEditor();
    return;
  }
});

el.pVideo.addEventListener('playing', () => { el.pLoading.style.display = 'none'; setPlayLabel('暂停'); setPlayIcon(false); });
el.pVideo.addEventListener('pause', () => { setPlayLabel('播放'); setPlayIcon(true); });
el.pVideo.addEventListener('seeked', () => { if (el.pVideo.paused) setPlayIcon(true); });
el.pVideo.addEventListener('canplay', () => { el.pLoading.style.display = 'none'; });
el.pVideo.addEventListener('error', () => {
  if (!el.pVideo.src || !state.current) return;
  if (state.retries < 2) { state.retries++; setTimeout(loadVideo, 700); }
  else { el.pLoading.style.display = 'none'; toast('视频加载失败'); }
});
function tickTime() {
  if (state.current) {
    el.pTime.textContent = fmtTime(el.pVideo.currentTime) + ' / ' + fmtTime(el.pVideo.duration);
  }
  requestAnimationFrame(tickTime);
}

/* ---------- 启动 ---------- */
(async function init() {
  restoreSession();
  try {
    state.clips = await loadClips();
    applyFilters();
  } catch (err) {
    el.meta.textContent = '加载失败';
    showError('案例库加载失败：' + err.message);
  }
  // 笔记独立加载，失败不影响案例库
  state.notes = await loadNotes();
  requestAnimationFrame(tickTime);
})();
</script>
